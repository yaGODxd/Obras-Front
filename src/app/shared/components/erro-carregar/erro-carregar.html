<div class="flex flex-col items-center py-16 gap-3 text-center" role="alert">
  <i class="ti ti-cloud-off text-6xl text-error/70"></i>
  <p class="font-medium">Não foi possível carregar os dados.</p>
  <p class="text-sm text-base-content/70 max-w-md">{{ mensagem() }}</p>
  <button class="btn btn-outline btn-sm gap-2" (click)="tentarDeNovo.emit()">
    <i class="ti ti-refresh"></i> Tentar de novo
  </button>
</div>
