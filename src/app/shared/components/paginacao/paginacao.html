@if (totalPaginas() > 1) {
  <div class="flex items-center justify-between mt-4">

    <p class="text-sm text-base-content/60">
      Mostrando {{ (pagina() - 1) * porPagina() + 1 }}–{{ [pagina() * porPagina(), total()].sort((a,b) => a-b)[0] }}
      de {{ total() }} registros
    </p>

    <nav class="join" aria-label="Paginação">
      <button
        class="join-item btn btn-sm"
        aria-label="Página anterior"
        [disabled]="pagina() === 1"
        (click)="anterior()">
        <i class="ti ti-chevron-left"></i>
      </button>

      @for (p of paginas(); track $index) {
        @if (p === '...') {
          <span class="join-item btn btn-sm btn-disabled" aria-hidden="true">...</span>
        } @else {
          <button
            class="join-item btn btn-sm"
            [class.btn-primary]="p === pagina()"
            [attr.aria-label]="'Página ' + p"
            [attr.aria-current]="p === pagina() ? 'page' : null"
            (click)="irPara(p)">
            {{ p }}
          </button>
        }
      }

      <button
        class="join-item btn btn-sm"
        aria-label="Próxima página"
        [disabled]="pagina() === totalPaginas()"
        (click)="proximo()">
        <i class="ti ti-chevron-right"></i>
      </button>
    </nav>

  </div>
}
