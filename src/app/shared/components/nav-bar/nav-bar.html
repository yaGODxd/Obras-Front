  <div class="flex min-h-screen">


  <div
    class="flex flex-col h-screen sticky top-0 shrink-0 transition-all duration-300 z-40 overflow-y-auto"
    [class.w-64]="sidebarAberta"
    [class.w-14]="!sidebarAberta"
    style="background-color: #1C2B3A;"
  >
    <ul class="menu w-full grow px-0 gap-0.5">

      <!-- Header / Toggle -->
      <li>
        <button
          class="text-white hover:bg-white/10 flex items-center w-full transition-all duration-300 rounded-none"
          [class.justify-between]="sidebarAberta"
          [class.justify-center]="!sidebarAberta"
          (click)="toggleSidebar()"
        >
          <span *ngIf="sidebarAberta" class="font-semibold truncate">SIGMAP</span>
          <i class="ti ti-layout-sidebar-left-collapse text-xl shrink-0 transition-transform duration-300"
            [class.rotate-180]="!sidebarAberta"></i>
        </button>
      </li>

      <li class="mx-2 my-1"><div class="border-t border-white/10"></div></li>

      <!-- GRUPO: Principal -->
      <li *ngIf="sidebarAberta">
        <button
          class="text-white/40 hover:text-white/70 text-xs uppercase tracking-widest font-semibold
                 flex items-center justify-between px-4 py-1 hover:bg-transparent w-full cursor-pointer"
          (click)="toggleGrupo('principal')"
        >
          <span>Principal</span>
          <i class="ti ti-chevron-down text-xs transition-transform duration-200"
            [class.rotate-180]="isGrupoAberto('principal')"></i>
        </button>
      </li>

      <ng-container *ngIf="isGrupoAberto('principal') || !sidebarAberta">

        <li>
          <a routerLink="/dashboard" routerLinkActive="bg-white/20"
            class="text-white hover:bg-white/10 transition-colors"
            [class.justify-center]="!sidebarAberta"
            [class.tooltip]="!sidebarAberta"
            [class.tooltip-right]="!sidebarAberta"
            data-tip="Dashboard">
            <i class="ti ti-map text-xl shrink-0"></i>
            <span *ngIf="sidebarAberta">Ao Vivo</span>
          </a>
        </li>

        <li>
          <a routerLink="/veiculos" routerLinkActive="bg-white/20"
            class="text-white hover:bg-white/10 transition-colors"
            [class.justify-center]="!sidebarAberta"
            [class.tooltip]="!sidebarAberta"
            [class.tooltip-right]="!sidebarAberta"
            data-tip="Veículos">
            <i class="ti ti-truck text-xl shrink-0"></i>
            <span *ngIf="sidebarAberta">Veículos</span>
          </a>
        </li>

        <li>
          <a routerLink="/lancamento-mensal" routerLinkActive="bg-white/20"
            class="text-white hover:bg-white/10 transition-colors"
            [class.justify-center]="!sidebarAberta"
            [class.tooltip]="!sidebarAberta"
            [class.tooltip-right]="!sidebarAberta"
            data-tip="Lançamento Mensal">
            <i class="ti ti-clipboard-list text-xl shrink-0"></i>
            <span *ngIf="sidebarAberta">Lançamento Mensal</span>
          </a>
        </li>

        <li>
          <a routerLink="/abastecimentos" routerLinkActive="bg-white/20"
            class="text-white hover:bg-white/10 transition-colors"
            [class.justify-center]="!sidebarAberta"
            [class.tooltip]="!sidebarAberta"
            [class.tooltip-right]="!sidebarAberta"
            data-tip="Abastecimentos">
            <i class="ti ti-gas-station text-xl shrink-0"></i>
            <span *ngIf="sidebarAberta">Abastecimentos</span>
          </a>
        </li>

      </ng-container>

      <li class="mx-2 my-1"><div class="border-t border-white/10"></div></li>

      <!-- GRUPO: Operacional -->
      <li *ngIf="sidebarAberta">
        <button
          class="text-white/40 hover:text-white/70 text-xs uppercase tracking-widest font-semibold
                 flex items-center justify-between px-4 py-1 hover:bg-transparent w-full cursor-pointer"
          (click)="toggleGrupo('operacional')"
        >
          <span>Operacional</span>
          <i class="ti ti-chevron-down text-xs transition-transform duration-200"
            [class.rotate-180]="isGrupoAberto('operacional')"></i>
        </button>
      </li>

      <ng-container *ngIf="isGrupoAberto('operacional') || !sidebarAberta">

        <li>
          <a routerLink="/manutencao" routerLinkActive="bg-white/20"
            class="text-white hover:bg-white/10 transition-colors"
            [class.justify-center]="!sidebarAberta"
            [class.tooltip]="!sidebarAberta"
            [class.tooltip-right]="!sidebarAberta"
            data-tip="Manutenção">
            <i class="ti ti-tool text-xl shrink-0"></i>
            <span *ngIf="sidebarAberta">Manutenção</span>
          </a>
        </li>

        <li>
          <a routerLink="/ocorrencias" routerLinkActive="bg-white/20"
            class="text-white hover:bg-white/10 transition-colors"
            [class.justify-center]="!sidebarAberta"
            [class.tooltip]="!sidebarAberta"
            [class.tooltip-right]="!sidebarAberta"
            data-tip="Estoque">
            <i class="ti ti-package text-xl shrink-0"></i>
            <span *ngIf="sidebarAberta">Ocorrencias</span>
          </a>
        </li>

      </ng-container>

      <li class="mx-2 my-1"><div class="border-t border-white/10"></div></li>

      <!-- GRUPO: Gestão -->
      <li *ngIf="sidebarAberta">
        <button
          class="text-white/40 hover:text-white/70 text-xs uppercase tracking-widest font-semibold
                 flex items-center justify-between px-4 py-1 hover:bg-transparent w-full cursor-pointer"
          (click)="toggleGrupo('gestao')"
        >
          <span>Gestão</span>
          <i class="ti ti-chevron-down text-xs transition-transform duration-200"
            [class.rotate-180]="isGrupoAberto('gestao')"></i>
        </button>
      </li>

      <ng-container *ngIf="isGrupoAberto('gestao') || !sidebarAberta">

        <li>
          <a routerLink="/relatorios" routerLinkActive="bg-white/20"
            class="text-white hover:bg-white/10 transition-colors"
            [class.justify-center]="!sidebarAberta"
            [class.tooltip]="!sidebarAberta"
            [class.tooltip-right]="!sidebarAberta"
            data-tip="Relatórios">
            <i class="ti ti-chart-bar text-xl shrink-0"></i>
            <span *ngIf="sidebarAberta">Relatórios</span>
          </a>
        </li>

        <li>
          <a routerLink="/cadastros" routerLinkActive="bg-white/20"
            class="text-white hover:bg-white/10 transition-colors"
            [class.justify-center]="!sidebarAberta"
            [class.tooltip]="!sidebarAberta"
            [class.tooltip-right]="!sidebarAberta"
            data-tip="Cadastros">
            <i class="ti ti-users text-xl shrink-0"></i>
            <span *ngIf="sidebarAberta">Cadastros</span>
          </a>
        </li>

        <li>
          <a routerLink="/configuracoes" routerLinkActive="bg-white/20"
            class="text-white hover:bg-white/10 transition-colors"
            [class.justify-center]="!sidebarAberta"
            [class.tooltip]="!sidebarAberta"
            [class.tooltip-right]="!sidebarAberta"
            data-tip="Configurações">
            <i class="ti ti-settings text-xl shrink-0"></i>
            <span *ngIf="sidebarAberta">Configurações</span>
          </a>
        </li>

        <li>
  <a routerLink="/logs" routerLinkActive="bg-white/20"
    class="text-white hover:bg-white/10 transition-colors"
    [class.justify-center]="!sidebarAberta"
    [class.tooltip]="!sidebarAberta"
    [class.tooltip-right]="!sidebarAberta"
    data-tip="Logs">
    <i class="ti ti-history text-xl shrink-0"></i>
    <span *ngIf="sidebarAberta">Logs</span>
  </a>
</li>

      </ng-container>

    </ul>

    <!-- Sair fixo no rodapé -->
    <div class="border-t border-white/10 mx-2 mt-auto"></div>
    <ul class="menu w-full px-0 pb-2">
      <li>
        <a
          class="text-white hover:bg-white/10 transition-colors cursor-pointer"
          [class.justify-center]="!sidebarAberta"
          [class.tooltip]="!sidebarAberta"
          [class.tooltip-right]="!sidebarAberta"
          data-tip="Sair"
          (click)="logout()">
          <i class="ti ti-logout text-xl shrink-0"></i>
          <span *ngIf="sidebarAberta">Sair</span>
        </a>
      </li>
    </ul>

  </div>

  <!-- Conteúdo principal -->
  <div class="flex-1 overflow-auto" id="conteudo-principal">
      <router-outlet></router-outlet>
  </div>

</div>
